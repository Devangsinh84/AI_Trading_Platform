name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ai-engine:
    name: Python AI engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Python_AI_Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Python_AI_Engine/requirements-test.txt
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: pytest

  dotnet-meta-controller:
    name: .NET Meta-Controller (xUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DotNet_MetaController
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore MetaController.Tests/MetaController.Tests.csproj
      - name: Build
        run: dotnet build MetaController.Tests/MetaController.Tests.csproj --no-restore --configuration Release
      - name: Run tests
        run: dotnet test MetaController.Tests/MetaController.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  react-dashboard:
    name: React dashboard (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: React_Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: React_Dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
